# Release On Multiple Platform
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: dlog-cloud-storage

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows
            arch: x86_64
            plat: windows
            xmake-arch: x64
            runtime: MD
            runs-on: windows-latest

          - os: windows
            arch: x86_64
            plat: windows
            xmake-arch: x64
            runtime: MDd
            runs-on: windows-latest

          - os: ubuntu
            arch: x86_64
            plat: linux
            xmake-arch: x86_64
            runtime: ""
            runs-on: ubuntu-latest

          - os: ubuntu
            arch: arm64
            plat: linux
            xmake-arch: arm64
            runtime: ""
            runs-on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup XMake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Configure XMake
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        args="-m release -p ${{ matrix.plat }} -a ${{ matrix.xmake-arch }}"

        if [ -n "${{ matrix.runtime }}" ]; then
            args="$args --runtimes=${{ matrix.runtime }}"
        fi

        xmake f $args -y

    - name: Build Targets
      working-directory: ${{ github.workspace }}
      run: xmake build

    # 使用安装目录作为应用发布目录。
    - name: Install Application
      working-directory: ${{ github.workspace }}
      run: xmake install -o build/release

    - name: Generate Archive Name
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        suffix=""

        if [ -n "${{ matrix.runtime }}" ]; then
            suffix="-${{ matrix.runtime }}"
        fi

        echo "ARCHIVE_NAME=$APP_NAME-${{ github.ref_name }}-${{ matrix.plat }}-${{ matrix.xmake-arch }}${suffix}.tar.gz" >> "$GITHUB_ENV"

    - name: Archive Application
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        tar czf "$ARCHIVE_NAME" -C build/release .

    - name: Upload Application
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARCHIVE_NAME }}
        path: "*.tar.gz"
        include-hidden-files: true
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download Applications
      uses: actions/download-artifact@v4
      with:
        path: assets
        merge-multiple: true

    - name: Display Release Assets
      run: tree assets -a

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: assets/*.tar.gz
